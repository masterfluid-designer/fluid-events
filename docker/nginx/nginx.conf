user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Uploads d'images (logos, couvertures, designs de billets) — la valeur par
    # défaut de 1 Mo rejetterait la plupart des visuels d'événement.
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    upstream api_backend {
        server api:4000;
    }
    upstream web_backend {
        server web:3000;
    }
    # MinIO : sert les fichiers publics du bucket aux navigateurs.
    upstream storage_backend {
        server minio:9000;
    }

    # En-têtes de proxy communs aux trois hôtes.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ─────────────────────────────────────────────────────────────────────
    # HTTP → HTTPS
    #
    # `/.well-known/acme-challenge/` reste servi en clair : c'est ce qui
    # permet à certbot de renouveler le certificat en mode webroot, SANS
    # arrêter Nginx (le mode standalone utilisé pour l'émission initiale
    # exige le port 80 libre, donc une coupure de service).
    # ─────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name fluidevent.online www.fluidevent.online
                    api.fluidevent.online storage.fluidevent.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────── Application (front Next.js) ───────────
    server {
        listen 443 ssl;
        http2 on;
        server_name fluidevent.online www.fluidevent.online;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://web_backend;
        }
    }

    # ─────────── API (NestJS) ───────────
    server {
        listen 443 ssl;
        http2 on;
        server_name api.fluidevent.online;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass http://api_backend;
            # Les webhooks de paiement peuvent être lents côté provider.
            proxy_read_timeout 60s;
        }
    }

    # ─────────── Stockage (MinIO, fichiers publics) ───────────
    server {
        listen 443 ssl;
        http2 on;
        server_name storage.fluidevent.online;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        add_header X-Content-Type-Options nosniff always;

        location / {
            proxy_pass http://storage_backend;
            # MinIO renvoie des objets potentiellement volumineux (PDF de
            # billets, visuels haute définition) — pas de mise en tampon.
            proxy_buffering off;
        }
    }
}
